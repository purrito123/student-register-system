<!DOCTYPE html>
<html>

<head>

    <title>Apply for Leave</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #1e3a8a;
            color: white;
            padding: 20px 40px;
        }

        .navbar h1 {
            font-size: 24px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 45px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            margin-bottom: 20px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #1e3a8a;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-button {
            width: 100%;
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #172d6b;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1e3a8a;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <h1>Student Portal</h1>

    </div>


    <div class="container">

        <div class="card">

            <h2>Apply for Leave</h2>

            <p class="description">
                Submit your leave request to the administration.
            </p>


            <form method="POST" action="/apply-leave">

                <label for="start_date">
                    Start Date
                </label>

                <input
                    type="date"
                    id="start_date"
                    name="start_date"
                    required
                >


                <label for="end_date">
                    End Date
                </label>

                <input
                    type="date"
                    id="end_date"
                    name="end_date"
                    required
                >


                <label for="reason">
                    Reason for Leave
                </label>

                <textarea
                    id="reason"
                    name="reason"
                    placeholder="Explain why you need leave..."
                    required
                ></textarea>


                <button
                    type="submit"
                    class="submit-button"
                >
                    Submit Leave Request
                </button>

            </form>


            <a
                href="/student-dashboard"
                class="back"
            >
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
