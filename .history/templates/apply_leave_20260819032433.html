<!DOCTYPE html>
<html>

<head>

    <title>Apply For Leave</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #e8e5d8;
            color: #20251d;
            font-family: "Courier New", monospace;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }


        .terminal {
            width: 100%;
            max-width: 550px;

            background: #eeeadd;

            border: 2px solid #20251d;

            box-shadow: 8px 8px 0 #20251d;
        }


        /* HEADER */

        .header {
            padding: 14px 18px;

            border-bottom: 2px solid #20251d;

            display: flex;
            justify-content: space-between;

            font-size: 12px;
        }


        /* CONTENT */

        .content {
            padding: 40px;
        }


        .number {
            font-size: 11px;

            opacity: 0.6;

            margin-bottom: 25px;
        }


        h1 {
            font-size: 32px;

            margin-bottom: 10px;
        }


        .description {
            font-size: 13px;

            line-height: 1.6;

            color: #555;

            margin-bottom: 30px;
        }


        /* FORM */

        label {
            display: block;

            font-size: 12px;

            margin-bottom: 7px;
        }


        input,
        textarea {
            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            background: #f5f2e7;

            border: 1px solid #20251d;

            color: #20251d;

            font-family: "Courier New", monospace;

            font-size: 14px;

            outline: none;
        }


        textarea {
            min-height: 110px;

            resize: vertical;
        }


        input:focus,
        textarea:focus {
            background: white;

            box-shadow: 3px 3px 0 #20251d;
        }


        button {
            width: 100%;

            padding: 12px;

            background: #20251d;

            color: #eeeadd;

            border: 2px solid #20251d;

            font-family: "Courier New", monospace;

            font-size: 13px;

            cursor: pointer;

            transition: 0.15s;
        }


        button:hover {
            background: #eeeadd;

            color: #20251d;
        }


        /* NOTICE */

        .notice {
            margin-top: 20px;

            padding: 12px;

            border: 1px dashed #20251d;

            font-size: 11px;

            line-height: 1.6;
        }


        /* BOTTOM */

        .bottom {
            border-top: 2px solid #20251d;

            padding: 15px 18px;

            font-size: 11px;
        }


        .bottom a {
            color: #20251d;

            text-decoration: none;

            border-bottom: 1px solid #20251d;
        }


        @media (max-width: 550px) {

            .content {
                padding: 30px;
            }

        }

    </style>

</head>


<body>


    <div class="terminal">


        <!-- HEADER -->

        <div class="header">

            <span>
                CAMPUS TERMINAL
            </span>

            <span>
                [ LEAVE REQUEST ]
            </span>

        </div>


        <!-- CONTENT -->

        <div class="content">


            <div class="number">
                01 / STUDENT SERVICES
            </div>


            <h1>
                APPLY FOR LEAVE
            </h1>


            <p class="description">
                Submit a leave request for review
                by the administration.
            </p>


            <form
                method="POST"
                action="/apply-leave"
            >


                <label for="from_date">
                    FROM DATE
                </label>

                <input
                 type="date"
                 id="start_date"
                 name="start_date"
                 required
                >


                <label for="to_date">
                    TO DATE
                </label>

                <input
                 type="date"
                id="end_date"
                name="end_date"
                required
                >


                <label for="reason">
                    REASON FOR LEAVE
                </label>

                <textarea
                    id="reason"
                    name="reason"
                    placeholder="Enter the reason for your leave..."
                    required
                ></textarea>


                <button type="submit">
                    [ SUBMIT REQUEST ]
                </button>


            </form>


            <div class="notice">

                NOTICE: Your request will remain
                <strong>Pending</strong> until reviewed
                by an administrator.

            </div>


        </div>


        <!-- BOTTOM -->

        <div class="bottom">

            RETURN TO DASHBOARD

            <a href="/student-dashboard">
                ← DASHBOARD
            </a>

        </div>


    </div>


</body>

</html>
