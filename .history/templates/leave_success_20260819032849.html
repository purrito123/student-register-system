<!DOCTYPE html>
<html>

<head>

    <title>Request Submitted</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #e8e5d8;
            color: #20251d;
            font-family: "Courier New", monospace;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }


        .terminal {
            width: 100%;
            max-width: 600px;

            background: #eeeadd;

            border: 2px solid #20251d;

            box-shadow: 8px 8px 0 #20251d;
        }


        .header {
            padding: 14px 18px;

            border-bottom: 2px solid #20251d;

            display: flex;
            justify-content: space-between;

            font-size: 12px;
        }


        .content {
            padding: 50px 40px;

            text-align: center;
        }


        .code {
            font-size: 11px;

            opacity: 0.6;

            margin-bottom: 30px;
        }


        .check {
            font-size: 55px;

            margin-bottom: 20px;
        }


        h1 {
            font-size: 30px;

            margin-bottom: 15px;
        }


        .message {
            font-size: 13px;

            line-height: 1.7;

            color: #555;

            max-width: 420px;

            margin: 0 auto 30px;
        }


        .status {
            display: inline-block;

            border: 1px solid #20251d;

            padding: 8px 15px;

            font-size: 11px;

            margin-bottom: 30px;
        }


        .buttons {
            display: flex;

            justify-content: center;

            gap: 10px;
        }


        .button {
            display: inline-block;

            padding: 10px 15px;

            border: 1px solid #20251d;

            color: #20251d;

            text-decoration: none;

            font-size: 11px;
        }


        .button:hover {
            background: #20251d;

            color: #eeeadd;
        }


        .primary {
            background: #20251d;

            color: #eeeadd;
        }


        .primary:hover {
            background: #eeeadd;

            color: #20251d;
        }


        .footer {
            border-top: 2px solid #20251d;

            padding: 12px 18px;

            display: flex;

            justify-content: space-between;

            font-size: 10px;
        }


        @media (max-width: 500px) {

            .content {
                padding: 40px 25px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <div class="terminal">


        <div class="header">

            <span>
                CAMPUS TERMINAL
            </span>

            <span>
                [ SYSTEM MESSAGE ]
            </span>

        </div>


        <div class="content">


            <div class="code">
                01 / STUDENT SERVICES / REQUEST
            </div>


            <div class="check">
                [ OK ]
            </div>


            <h1>
                REQUEST SUBMITTED
            </h1>


            <p class="message">
                Your leave application has been
                successfully transmitted to the
                administration system.
            </p>


            <div class="status">
                STATUS: PENDING REVIEW
            </div>


            <div class="buttons">

    <a
        href="/student-dashboard"
        class="button primary"
    >
        [ DASHBOARD ]
    </a>


    <a
        href="/apply-leave"
        class="button"
    >
        [ NEW REQUEST ]
    </a>


    <a
        href="/"
        class="button"
    >
        [ HOME ]
    </a>

</div>


        </div>


        <div class="footer">

            <span>
                TRANSMISSION: COMPLETE
            </span>

            <span>
                CAMPUS_SYS.EXE
            </span>

        </div>


    </div>


</body>

</html>
