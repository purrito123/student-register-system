<!DOCTYPE html>
<html>

<head>

    <title>Student Registration</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #e8e5d8;
            color: #20251d;
            font-family: "Courier New", monospace;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .terminal {
            width: 100%;
            max-width: 550px;

            background: #eeeadd;

            border: 2px solid #20251d;

            box-shadow: 8px 8px 0 #20251d;
        }

        .header {
            padding: 14px 18px;

            border-bottom: 2px solid #20251d;

            display: flex;
            justify-content: space-between;

            font-size: 12px;
        }

        .content {
            padding: 40px;
        }

        .number {
            font-size: 11px;
            opacity: 0.6;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .description {
            font-size: 13px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
        }

        label {
            display: block;

            font-size: 12px;

            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            background: #f5f2e7;

            border: 1px solid #20251d;

            color: #20251d;

            font-family: "Courier New", monospace;

            font-size: 14px;

            outline: none;
        }

        input:focus,
        select:focus {
            background: white;

            box-shadow: 3px 3px 0 #20251d;
        }

        button {
            width: 100%;

            padding: 12px;

            background: #20251d;

            color: #eeeadd;

            border: 2px solid #20251d;

            font-family: "Courier New", monospace;

            font-size: 13px;

            cursor: pointer;

            transition: 0.15s;
        }

        button:hover {
            background: #eeeadd;

            color: #20251d;
        }

        .bottom {
            border-top: 2px solid #20251d;

            padding: 15px 18px;

            font-size: 11px;
        }

        .bottom a {
            color: #20251d;

            text-decoration: none;

            border-bottom: 1px solid #20251d;
        }

        @media (max-width: 550px) {

            .content {
                padding: 30px;
            }

        }

    </style>

</head>


<body>


    <div class="terminal">


        <div class="header">

            <span>
                CAMPUS TERMINAL
            </span>

            <span>
                [ REGISTER ]
            </span>

        </div>


        <div class="content">


            <div class="number">
                01 / STUDENT REGISTRATION
            </div>


            <h1>
                CREATE ACCOUNT
            </h1>


            <p class="description">
                Register your student credentials
                to access the campus portal.
            </p>


            <form method="POST" action="/student-register">


                <label for="name">
                    FULL NAME
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <label for="dob">
                    DATE OF BIRTH
                </label>

                <input
                    type="date"
                    id="dob"
                    name="dob"
                    required
                >


                <label for="course">
                    COURSE
                </label>

                <select
                    id="course"
                    name="course"
                    required
                >

                    <option value="">
                        Select your course
                    </option>

                    <option value="Computer Science">
                        Computer Science
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Mechanical Engineering">
                        Mechanical Engineering
                    </option>

                    <option value="Electrical Engineering">
                        Electrical Engineering
                    </option>

                    <option value="Aerospace Engineering">
                        Aerospace Engineering
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label for="email">
                    EMAIL
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="student@email.com"
                    required
                >


                <label for="password">
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >


                <button type="submit">
                    [ CREATE ACCOUNT ]
                </button>


            </form>


        </div>


        <div class="bottom">

            ALREADY REGISTERED?

            <a href="/login">
                LOGIN →
            </a>

        </div>


    </div>


</body>

</html>
